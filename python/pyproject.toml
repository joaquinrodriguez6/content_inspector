[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "content_inspector_py"
version = "0.1.0"
description = "PyO3 bindings for the content_inspector Rust crate (text-vs-binary detection)."
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }

[project.optional-dependencies]
test = ["pytest"]
